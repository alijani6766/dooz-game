<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بازی دوز</title>

<link rel="manifest" href="manifest.json">


<style>


body {

    text-align: center;

    font-family: Arial;

    background: #f2f2f2;

}



h1 {

    color: goldenrod;

    -webkit-text-stroke: 1px black;

    margin-top: 40px;

}



.game {


    display: grid;

    grid-template-columns: repeat(3, 28vw);

    gap: 2vw;

    justify-content: center;


}



.box {


    width: 28vw;

    height: 28vw;


    background: white;


    border: 2px solid black;


    border-radius: 15px;


    font-size: 15vw;


    display: flex;


    align-items: center;


    justify-content: center;


    cursor: pointer;


}




button {


    margin-top: 25px;


    padding: 12px 30px;


    font-size: 20px;


    border-radius: 10px;


    cursor: pointer;


    background: green;


    color: white;


    border: 2px solid black;


}



</style>


</head>



<body>



<div id="menu">


<h1>بازی دوز</h1>


<button id="start">شروع بازی</button>


</div>





<div id="gameArea" style="display:none;">



<h2 id="turnText">نوبت: X</h2>


<h3 id="score">X: 0 | 0: 0 | 0 :مساوی</h3>



<div class="game">


<div class="box"></div>

<div class="box"></div>

<div class="box"></div>


<div class="box"></div>

<div class="box"></div>

<div class="box"></div>


<div class="box"></div>

<div class="box"></div>

<div class="box"></div>



</div>



<button id="restart">شروع دوباره</button>



</div>






<script>



let boxes = document.querySelectorAll(".box");

let turn = "X";

let gameOver = false;

let moves = 0;

let xScore = Number(localStorage.getItem("xScore")) || 0;

let oScore = Number(localStorage.getItem("oScore")) || 0;

let drawScore = Number(localStorage.getItem("drawScore")) || 0;

let score = document.querySelector("#score");

score.innerHTML = "X: " + xScore + 
" | O: " + oScore + 
" | مساوی: " + drawScore;


let turnText = document.querySelector("#turnText");


let winPatterns = [


[0,1,2],

[3,4,5],

[6,7,8],


[0,3,6],

[1,4,7],

[2,5,8],


[0,4,8],

[2,4,6]


];





boxes.forEach(function(box){



box.onclick = function(){



if(box.innerHTML == "" && gameOver == false){



box.innerHTML = turn;


box.style.color = turn == "X" ? "red" : "blue";


moves++;



checkWinner();




if(turn == "X"){


turn = "O";


}else{


turn = "X";


}



turnText.innerHTML = "نوبت: " + turn;


turnText.style.color = turn == "X" ? "red" : "blue";



}



}



});







function checkWinner(){



for(let pattern of winPatterns){



let a = boxes[pattern[0]].innerHTML;

let b = boxes[pattern[1]].innerHTML;

let c = boxes[pattern[2]].innerHTML;




if(a != "" && a == b && b == c){



alert(a + " برنده شد!");

gameOver = true;


if(a == "X"){

    xScore++;

}else{

    oScore++;

}


score.innerHTML = "X: " + xScore + 
" | O: " + oScore + 
" | مساوی: " + drawScore;

localStorage.setItem("xScore", xScore);

localStorage.setItem("oScore", oScore);

localStorage.setItem("drawScore", drawScore);


}



}




if(moves == 9 && gameOver == false){



alert("مساوی شد!");

gameOver = true;


drawScore++;


score.innerHTML = "X: " + xScore + 
" | O: " + oScore + 
" | مساوی: " + drawScore;



}




}







let restart = document.querySelector("#restart");



restart.onclick = function(){



boxes.forEach(function(box){



box.innerHTML = "";

box.style.color = "black";



});



turn = "X";

moves = 0;

gameOver = false;


turnText.innerHTML = "نوبت: X";

turnText.style.color = "red";



};









let start = document.querySelector("#start");

let menu = document.querySelector("#menu");

let gameArea = document.querySelector("#gameArea");



start.onclick = function(){



menu.style.display = "none";


gameArea.style.display = "block";



};



</script>




</body>


</html>
